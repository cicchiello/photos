# -----------------------------------------------------------
# HTTP VIRTUAL HOST
# -----------------------------------------------------------
<VirtualHost *:80>
    ServerName media.jfcenterprises.com
    DocumentRoot /var/www/html

    # Redirect all HTTP requests to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =media.jfcenterprises.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    # Optional logging
    ErrorLog ${APACHE_LOG_DIR}/media-http-error.log
    CustomLog ${APACHE_LOG_DIR}/media-http-access.log combined
</VirtualHost>

# -----------------------------------------------------------
# HTTPS VIRTUAL HOST
# -----------------------------------------------------------
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName media.jfcenterprises.com
        DocumentRoot /var/www/html

        SSLEngine on

        # Let's Encrypt certificate & key paths
        # Adjust if using a different cert location (e.g. DNS-01 challenge)
        SSLCertificateFile /home/couchdb/letsencrypt/live/media.jfcenterprises.com/fullchain.pem
        SSLCertificateKeyFile /home/couchdb/letsencrypt/live/media.jfcenterprises.com/privkey.pem

        <IfModule mod_headers.c>
	   Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://db.jfcenterprises.com:6984"
        </IfModule>
	
        # Optional logging
        ErrorLog ${APACHE_LOG_DIR}/media-https-error.log
        CustomLog ${APACHE_LOG_DIR}/media-https-access.log combined

        <Directory /var/www/html>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>
